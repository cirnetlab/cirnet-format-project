name: Verify Rust Project Format

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select Rust stable with lint tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --all-features --all-targets -- -D warnings
      - run: cargo +stable clippy --locked --no-default-features --all-targets -- -D warnings
      - run: cargo +stable clippy --locked --no-default-features --features package --all-targets -- -D warnings
      - run: cargo +stable test --locked --all-features
      - run: cargo +stable test --locked --no-default-features
      - run: cargo +stable test --locked --no-default-features --features package
      - name: Test Windows reparse-point rejection
        if: runner.os == 'Windows'
        run: cargo +stable test --locked --test native symlinked_native_resources_are_rejected -- --ignored
      - run: cargo +stable build --locked --release --all-features
      - run: cargo +stable doc --locked --all-features --no-deps

  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.89.0 --profile minimal --target wasm32-unknown-unknown
      - run: cargo +1.89.0 test --locked --all-features
      - run: cargo +1.89.0 check --locked --no-default-features --target wasm32-unknown-unknown
      - run: cargo +1.89.0 check --locked --no-default-features --features package --target wasm32-unknown-unknown

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the Project Format Draft 2020-12 schemas
        shell: bash
        run: |
          schema_tools="$RUNNER_TEMP/cirnet-schema-tools"
          npm install --prefix "$schema_tools" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund ajv@8.20.0
          node tests/check-schemas.cjs "$schema_tools/node_modules/ajv/dist/2020.js"
