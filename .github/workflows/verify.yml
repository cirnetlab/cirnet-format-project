name: Verify Rust Project Format

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select Rust stable with lint tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --all-features --all-targets -- -D warnings
      - run: cargo +stable clippy --locked --no-default-features --all-targets -- -D warnings
      - run: cargo +stable test --locked --all-features
      - run: cargo +stable test --locked --no-default-features
      - name: Test Windows reparse-point rejection
        if: runner.os == 'Windows'
        run: cargo +stable test --locked --test native symlinked_native_resources_are_rejected -- --ignored
      - run: cargo +stable build --locked --release --all-features
      - run: cargo +stable doc --locked --all-features --no-deps
